# API for the server. Joins the network of the existing kira-db stack instead of
# creating its own, and talks to Postgres internally at kira-db:5432.
services:
  api:
    build: .
    image: kira-api
    container_name: kira-api
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 9998
    ports:
      - '127.0.0.1:9998:9998'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:9998/health || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  default:
    name: kiraweb_default
    external: true
