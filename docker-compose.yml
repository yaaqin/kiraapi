services:
  db:
    image: postgres:17-alpine
    container_name: kira-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kira}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kira}
      POSTGRES_DB: ${POSTGRES_DB:-kira}
    ports:
      - '9997:5432'
    volumes:
      - kira-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kira-db-data:
